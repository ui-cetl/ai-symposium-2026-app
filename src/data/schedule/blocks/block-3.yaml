# Block 3: Room A runs one 35-minute session followed by a 40-minute break;
# Room B splits into two 35-minute sessions with a 5-minute break; Room C
# runs one full-length session.
id: block-3
label: Block 3 · Afternoon
startTime: '13:00'
durationMinutes: 75

rooms:
  - room: room-a
    items:
      - kind: session
        id: block-3-room-a-1
        title: Ethics in Autonomous Systems
        speakers: [John McCarthy]
        track: Ethics
        durationMinutes: 35
        abstract: >
          An on-site repeat of the morning's remote session, for attendees
          who could not join live.
        description: >
          As autonomous systems take on higher-stakes decisions, existing
          accountability frameworks built around human decision-makers start
          to strain. This on-site repeat covers the same ground as the
          morning's remote session: emerging governance models for shared
          human-AI accountability, where liability currently falls when an
          autonomous system causes harm, and a practical oversight checklist
          for teams deploying autonomous decision-making systems.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/ethics-autonomous-systems.pdf
        artifacts:
          - label: Governance checklist
            url: https://example.org/symposium/artifacts/autonomous-systems-checklist
      - kind: break
        durationMinutes: 40
        label: Room reset

  - room: room-b
    items:
      - kind: session
        id: block-3-room-b-1
        title: Prompt Engineering for Domain Experts
        speakers: [Grace Hopper]
        track: Design
        durationMinutes: 35
        abstract: >
          Teaching non-engineers to write reliable prompts for their own
          workflows.
        description: >
          Domain experts often know exactly what they want from a model but
          struggle to express it in a prompt that behaves consistently.
          This talk shares a teaching approach built around reusable prompt
          templates, structured examples, and a short feedback loop that
          lets non-engineers iterate on their own prompts without needing to
          understand the underlying model architecture.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/prompt-engineering-domain-experts.pdf
        artifacts:
          - label: Prompt template library
            url: https://example.org/symposium/artifacts/prompt-template-library
      - kind: break
        durationMinutes: 5
        label: Room changeover
      - kind: session
        id: block-3-room-b-2
        title: Guardrails and Safety Filters
        speakers: [Alan Turing]
        track: Infrastructure
        durationMinutes: 35
        abstract: >
          Layered approaches to catching unsafe model output before it
          reaches a user.
        description: >
          No single guardrail catches everything, so production systems end
          up layering several: input classifiers, output filters, and
          rule-based fallbacks that intervene when a model's confidence is
          low. This talk compares these layers, discusses their respective
          latency and false-positive costs, and shares a monitoring
          approach for catching guardrail failures before they become
          incidents.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/guardrails-safety-filters.pdf
        artifacts:
          - label: Filter rule set
            url: https://example.org/symposium/artifacts/safety-filter-rules

  - room: room-c
    items:
      - kind: session
        id: block-3-room-c-1
        title: Multi-Agent Collaboration
        speakers: [Margaret Hamilton]
        track: Research
        durationMinutes: 75
        abstract: >
          Closing session on coordinating multiple specialized agents
          toward a shared goal.
        description: >
          Closing out the day, this session pulls together the coordination
          patterns discussed throughout the symposium into a single working
          example: a small team of specialized agents handling an
          end-to-end task with supervisor oversight, shared memory, and
          graceful handoff when one agent gets stuck. We will trace a full
          run live, including what happens when a step fails partway
          through.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/multi-agent.pdf
        artifacts:
          - label: Reference implementation
            url: https://example.org/symposium/artifacts/multi-agent-reference

