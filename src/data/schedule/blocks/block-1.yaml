# Block 1: Room A runs one full-length session; Room B splits into two
# 35-minute sessions with a 5-minute break; Room C runs one 35-minute
# session followed by a 40-minute break (room free for the rest of the block).
id: block-1
label: Block 1 · Morning
startTime: '09:00'
durationMinutes: 75

rooms:
  - room: room-a
    items:
      - kind: session
        id: block-1-room-a-1
        title: The Future of Agentic AI
        speakers: [Ada Lovelace]
        track: Engineering
        durationMinutes: 75
        abstract: >
          A keynote-style look at where agentic AI systems are headed over
          the next few years, and what that means for practitioners today.
        description: >
          Agentic AI systems are moving from research demos to production
          workloads faster than most organizations are ready for. This talk
          traces that shift through three lenses: the architectural patterns
          that have proven durable across real deployments, the operational
          failure modes teams keep rediscovering the hard way, and the open
          research questions that will shape the next generation of agent
          frameworks. We will close with a candid look at where the hype
          outpaces the evidence, and a practical checklist for deciding
          whether an agentic approach is the right fit for a given problem.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/agentic-ai.pdf
        artifacts:
          - label: Reference architecture repo
            url: https://example.org/symposium/artifacts/agentic-ai-reference-arch

  - room: room-b
    items:
      - kind: session
        id: block-1-room-b-1
        title: Scaling LLM Inference
        speakers: [Alan Turing]
        track: Infrastructure
        durationMinutes: 35
        abstract: >
          Practical techniques for serving large models efficiently at
          production scale.
        description: >
          Serving large language models cost-effectively requires trade-offs
          across batching strategy, quantization, and hardware placement that
          rarely show up in a benchmark blog post. This session walks through
          a production inference stack end to end, covering request
          batching, KV-cache management, and multi-GPU sharding strategies,
          along with the monitoring signals that catch regressions before
          users notice.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/scaling-llm-inference.pdf
          - label: Recording
            url: https://example.org/symposium/recordings/scaling-llm-inference.mp4
        artifacts:
          - label: Benchmark harness
            url: https://example.org/symposium/artifacts/llm-inference-benchmarks
      - kind: break
        durationMinutes: 5
        label: Room changeover
      - kind: session
        id: block-1-room-b-2
        title: Efficient Fine-Tuning Techniques
        speakers: [Grace Hopper]
        track: Infrastructure
        durationMinutes: 35
        abstract: >
          Comparing parameter-efficient fine-tuning methods for adapting
          foundation models to niche domains.
        description: >
          LoRA, adapters, and prefix-tuning all promise cheaper fine-tuning,
          but they behave very differently depending on dataset size, domain
          shift, and target hardware. This talk compares them head to head
          on a shared set of niche-domain tasks, with concrete guidance on
          which technique to reach for first and how to budget compute for
          experimentation before committing to a full fine-tuning run.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/efficient-fine-tuning.pdf
        artifacts:
          - label: Training notebooks
            url: https://example.org/symposium/artifacts/fine-tuning-notebooks

  - room: room-c
    items:
      - kind: session
        id: block-1-room-c-1
        title: Designing Human-AI Interfaces
        speakers: [Margaret Hamilton]
        track: Design
        durationMinutes: 35
        abstract: >
          What makes an AI-powered interface feel trustworthy, and how to
          design for graceful failure.
        description: >
          Trust in an AI-powered interface is built or broken in the small
          moments: how uncertainty is communicated, how a wrong answer is
          recovered from, and how much control a user retains over an
          automated suggestion. This talk works through a set of interaction
          patterns for surfacing model confidence, designing undo-friendly
          flows, and degrading gracefully when a model's output should not
          be trusted outright.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/human-ai-interfaces.pdf
        artifacts:
          - label: Figma pattern library
            url: https://example.org/symposium/artifacts/human-ai-interface-patterns
      - kind: break
        durationMinutes: 40
        label: Room reset

remote:
  - id: block-1-remote-1
    title: Ethics in Autonomous Systems
    speakers: [John McCarthy]
    track: Ethics
    durationMinutes: 75
    joinInfo: Zoom link emailed to registered remote attendees
    abstract: >
      Examining accountability and oversight questions raised by
      increasingly autonomous AI systems.
    description: >
      As autonomous systems take on higher-stakes decisions, existing
      accountability frameworks built around human decision-makers start to
      strain. This talk surveys emerging governance models for shared
      human-AI accountability, discusses where liability currently falls
      when an autonomous system causes harm, and proposes a practical
      oversight checklist teams can apply before deploying an autonomous
      decision-making system into production.
    resources:
      - label: Slides
        url: https://example.org/symposium/slides/ethics-autonomous-systems.pdf
    artifacts:
      - label: Governance checklist
        url: https://example.org/symposium/artifacts/autonomous-systems-checklist
  - id: block-1-remote-2
    title: Multi-Agent Collaboration Patterns
    speakers: [Margaret Hamilton]
    track: Research
    durationMinutes: 75
    joinInfo: Zoom link emailed to registered remote attendees
    abstract: >
      An overview of coordination strategies for teams of specialized AI
      agents working toward a shared goal.
    description: >
      Coordinating multiple specialized agents introduces failure modes
      that single-agent systems never encounter: conflicting sub-goals,
      message ordering races, and cascading errors when one agent's mistake
      becomes another agent's input. This talk catalogs the coordination
      patterns that hold up in practice, from simple supervisor/worker
      hierarchies to market-based task allocation, and shares debugging
      techniques for tracing a failure back to its originating agent.
    resources:
      - label: Slides
        url: https://example.org/symposium/slides/multi-agent-collaboration-patterns.pdf
    artifacts:
      - label: Simulation environment
        url: https://example.org/symposium/artifacts/multi-agent-simulation
