# Block 2: Room A splits into two 35-minute sessions with a 5-minute break;
# Room B runs one full-length session; Room C runs one 35-minute session
# followed by a 40-minute break.
id: block-2
label: Block 2 · Midday
startTime: '10:30'
durationMinutes: 75

rooms:
  - room: room-a
    items:
      - kind: session
        id: block-2-room-a-1
        title: Retrieval-Augmented Generation in Practice
        speakers: [Ada Lovelace]
        track: Engineering
        durationMinutes: 35
        abstract: >
          Lessons learned wiring retrieval pipelines into production LLM
          applications.
      - kind: break
        durationMinutes: 5
        label: Room changeover
      - kind: session
        id: block-2-room-a-2
        title: Evaluating LLM Output Quality
        speakers: [Alan Turing]
        track: Research
        durationMinutes: 35
        abstract: >
          Approaches to measuring correctness, helpfulness, and safety in
          generated text.

  - room: room-b
    items:
      - kind: session
        id: block-2-room-b-1
        title: Building Reliable Agent Workflows
        speakers: [Grace Hopper]
        track: Engineering
        durationMinutes: 75
        abstract: >
          Patterns for keeping multi-step agent workflows observable,
          testable, and recoverable when a step fails.
        artifacts:
          - label: Workshop handout
            url: https://example.org/symposium/handouts/agent-workflows.pdf

  - room: room-c
    items:
      - kind: session
        id: block-2-room-c-1
        title: Accessibility in AI-Generated Interfaces
        speakers: [Margaret Hamilton]
        track: Design
        durationMinutes: 35
        abstract: >
          Practical checks for keeping AI-assisted UI generation accessible
          by default.
      - kind: break
        durationMinutes: 40
        label: Room reset

remote:
  - id: block-2-remote-1
    title: Governance for AI Procurement
    speakers: [John McCarthy]
    track: Ethics
    durationMinutes: 75
    joinInfo: Zoom link emailed to registered remote attendees
