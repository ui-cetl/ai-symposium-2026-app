rooms:
  - room: room-a
    items:
      - kind: session
        id: block-4-room-a-1
        title: 'Closing Keynote: Practical Next Steps for AI Adoption'
        speakers: [Ada Lovelace]
        track: Keynote
        durationMinutes: 35
        abstract: >
          Turning a day of ideas into a concrete plan: what to try first,
          what to defer, and how to measure whether it's working.
        description: >
          Every session today offered a piece of the puzzle — architecture,
          ethics, guardrails, evaluation — but turning that into an actual
          adoption plan is its own skill. This closing keynote proposes a
          simple three-month roadmap template for teams heading home from
          the symposium: one small, safe pilot; one measurable success
          criterion; and one explicit checkpoint for deciding whether to
          expand, pause, or stop. We'll walk through how to fill it in live.
        resources:
          - label: Slides
            url: https://example.org/symposium/slides/closing-keynote-next-steps.pdf
        artifacts:
          - label: Adoption roadmap template
            url: https://example.org/symposium/artifacts/adoption-roadmap-template
