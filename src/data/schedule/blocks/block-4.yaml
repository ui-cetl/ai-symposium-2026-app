        durationMinutes: 5
        label: Room changeover
      - kind: session
        id: block-4-room-a-2
        title: 'Closing Remarks: Building What Comes Next'
        speakers: [Margaret Hamilton]
        track: Keynote
        durationMinutes: 35
        abstract: >
          A final wrap-up connecting today's themes, thanking speakers and
          organizers, and previewing what's planned for next year.
        description: >
          To close out the day, a short synthesis of the threads that ran
          through every session — partnership over replacement, evidence
          over hype, and accountability designed in from the start — along
          with thanks to the speakers, organizers, and attendees who made
          the symposium possible. We'll end with a preview of next year's
          themes and how to get involved in shaping them.
        resources:
